<section id="donate">
    <h2>💖 Help Us Reach Our Goal!</h2>
    <p><strong>Current Donations:</strong> <span id="donationAmount">$0</span> of $10,000</p>
    
    <!-- Progress Bar -->
    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>
    
    <!-- Donate Button -->
    <button onclick="donateNow()">Donate via PayPal</button>

    <h3>🌟 Recent Donations</h3>
    <ul id="donationList">
        <li>No donations yet. Be the first! 🐾</li>
    </ul>
</section>

<script>
    // Initialize donation data
    let donationTotal = 2500; // Start with $2500 raised
    let donationGoal = 10000; // Goal is $10,000

    // Function to update the donation display
    function updateDonations(amount) {
        donationTotal += amount;
        document.getElementById("donationAmount").innerText = `$${donationTotal}`;
        
        // Update progress bar width
        let progressPercentage = (donationTotal / donationGoal) * 100;
        document.getElementById("progressBar").style.width = progressPercentage + "%";

        // Add new donation to the list
        let donationList = document.getElementById("donationList");
        
        // Remove "No donations yet" message if it exists
        if (donationList.children[0] && donationList.children[0].innerText.includes("No donations yet")) {
            donationList.innerHTML = "";
        }

        let newDonation = document.createElement("li");
        newDonation.textContent = `🎉 Someone donated $${amount}!`;
        donationList.prepend(newDonation);
    }

    // Function to handle donations
    function donateNow() {
        let amount = prompt("Enter donation amount ($)");
        amount = parseInt(amount);
        
        if (!isNaN(amount) && amount > 0) {
            alert("Thank you for your donation! ❤️");
            updateDonations(amount);
        } else {
            alert("Please enter a valid amount.");
        }
    }

    // Initialize the progress bar on page load
    document.addEventListener("DOMContentLoaded", function () {
        document.getElementById("donationAmount").innerText = `$${donationTotal}`;
        document.getElementById("progressBar").style.width = (donationTotal / donationGoal) * 100 + "%";
    });
</script>
